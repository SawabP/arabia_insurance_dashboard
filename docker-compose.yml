services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arabia-insurance-dashboard-frontend
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      AIVA_BACKEND_URL: ${AIVA_BACKEND_URL:-http://127.0.0.1:8002}
    networks:
      - default
      - n8n_default
    ports:
      - "3000:3000"
    restart: unless-stopped

networks:
  n8n_default:
    external: true
