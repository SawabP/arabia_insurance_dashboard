services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arabia-insurance-dashboard-frontend
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "3000:3000"
    restart: unless-stopped
